---
# =============================================================================
# PharmaChain Blockchain Microservice — docker-compose.yml
# One-click start: docker compose up --build
# Orchestrates: CA, Orderer, Peer, CouchDB, Fabric Setup, Spring Boot Gateway
# =============================================================================

name: pharmachain-blockchain

volumes:
  orderer.example.com:
  peer0.org1.example.com:
  couchdb0:

networks:
  pharma-fabric:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # 1. Certificate Authority for Org1
  # ---------------------------------------------------------------------------
  ca.org1.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.org1.example.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/fabric-ca/org1:/etc/hyperledger/fabric-ca-server
    ports:
      - "7054:7054"
    networks:
      - pharma-fabric

  # ---------------------------------------------------------------------------
  # 2. Certificate Authority for Orderer
  # ---------------------------------------------------------------------------
  ca.orderer.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.orderer.example.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
    ports:
      - "9054:9054"
    networks:
      - pharma-fabric

  # ---------------------------------------------------------------------------
  # 3. CouchDB — World State Database for Peer
  # ---------------------------------------------------------------------------
  couchdb0:
    image: couchdb:3.3
    container_name: couchdb0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb0:/opt/couchdb/data
    networks:
      - pharma-fabric

  # ---------------------------------------------------------------------------
  # 4. Fabric Orderer (Raft single-node)
  # ---------------------------------------------------------------------------
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.example.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/channel-artifacts/mychannel.block
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17050
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - ./organizations/channel-artifacts:/var/hyperledger/channel-artifacts
      - orderer.example.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
    networks:
      - pharma-fabric
    depends_on:
      fabric-setup-crypto:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # 5. Peer Node (Org1)
  # ---------------------------------------------------------------------------
  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org1.example.com
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=pharmachain-blockchain_pharma-fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17051
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.org1.example.com:/var/hyperledger/production
    ports:
      - "7051:7051"
      - "9444:9444"
    networks:
      - pharma-fabric
    depends_on:
      couchdb0:
        condition: service_started
      fabric-setup-crypto:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # 6. Crypto Material Generator (runs ONCE, then exits)
  #    Uses hyperledger/fabric-tools to run cryptogen + configtxgen
  # ---------------------------------------------------------------------------
  fabric-setup-crypto:
    image: hyperledger/fabric-tools:2.5
    container_name: fabric-setup-crypto
    volumes:
      - ./scripts:/scripts
      - ./config:/config
      - ./organizations:/organizations
    command: /bin/bash /scripts/generate-crypto.sh
    networks:
      - pharma-fabric

  # ---------------------------------------------------------------------------
  # 7. Chaincode Java Build Service (runs ONCE, compiles shadowJar, then exits)
  # ---------------------------------------------------------------------------
  fabric-build-chaincode:
    image: gradle:8-jdk17
    container_name: fabric-build-chaincode
    volumes:
      - ./chaincode:/app
    working_dir: /app
    command: gradle shadowJar --no-daemon -x checkstyleMain -x checkstyleTest
    networks:
      - pharma-fabric

  # ---------------------------------------------------------------------------
  # 8. Channel & Chaincode Deployer (runs after peer, orderer and chaincode build are ready)
  #    Creates mychannel, installs pharmacc, and exits
  # ---------------------------------------------------------------------------
  fabric-setup-channel:
    image: hyperledger/fabric-tools:2.5
    container_name: fabric-setup-channel
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ROOTCERT_FILE=/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - ORDERER_CA=/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt
    volumes:
      - ./scripts:/scripts
      - ./config:/config
      - ./organizations:/organizations
      - ./chaincode:/chaincode
      - /var/run/docker.sock:/host/var/run/docker.sock
    command: /bin/bash /scripts/deploy-channel.sh
    networks:
      - pharma-fabric
    depends_on:
      peer0.org1.example.com:
        condition: service_started
      orderer.example.com:
        condition: service_started
      fabric-build-chaincode:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # 9. Spring Boot REST Gateway (starts only after chaincode is deployed)
  # ---------------------------------------------------------------------------
  pharma-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharma-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "pharma-core:host-gateway"
    ports:
      - "8080:8080"
    environment:
      - PHARMA_CORE_JWKS_URL=${PHARMA_CORE_JWKS_URL:-http://host.docker.internal:4000/.well-known/jwks.json}
      - CHANNEL_NAME=mychannel
      - MSP_ID=Org1MSP
      - PEER_ENDPOINT=peer0.org1.example.com:7051
      - PEER_OVERRIDE_AUTH=peer0.org1.example.com
      - FABRIC_CERT_PATH=/crypto/users/User1@org1.example.com/msp/signcerts/cert.pem
      - FABRIC_KEY_DIR=/crypto/users/User1@org1.example.com/msp/keystore
      - FABRIC_TLS_CERT_PATH=/crypto/peers/peer0.org1.example.com/tls/ca.crt
    volumes:
      - ./organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts:/crypto/users/User1@org1.example.com/msp/signcerts:ro
      - ./organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore:/crypto/users/User1@org1.example.com/msp/keystore:ro
      - ./organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/crypto/peers/peer0.org1.example.com/tls:ro
    networks:
      - pharma-fabric
    depends_on:
      fabric-setup-channel:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
