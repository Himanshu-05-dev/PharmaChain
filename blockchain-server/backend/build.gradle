plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.pharma'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()

}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.hyperledger.fabric:fabric-gateway:1.5.1'
    implementation 'io.grpc:grpc-netty-shaded:1.80.0'

    constraints {
        implementation('io.grpc:grpc-api') { version { strictly '1.80.0' } }
        implementation('io.grpc:grpc-core') { version { strictly '1.80.0' } }
        implementation('io.grpc:grpc-context') { version { strictly '1.80.0' } }
        implementation('io.grpc:grpc-netty-shaded') { version { strictly '1.80.0' } }
        implementation('io.grpc:grpc-util') { version { strictly '1.80.0' } }
        implementation('io.grpc:grpc-stub') { version { strictly '1.80.0' } }
        implementation('io.grpc:grpc-protobuf') { version { strictly '1.80.0' } }
    }
}

tasks.named('test') {
	useJUnitPlatform()
}
